# nginx for the dashboard SPA (image nginxinc/nginx-unprivileged, runs as uid 101, listens on 8080).
# This replaces the image's /etc/nginx/nginx.conf completely, so every setting in effect is in this file.
#
# Read-only root filesystem: nginx writes only its pid file and temp files, all under /tmp, so the chart
# must mount an emptyDir at /tmp (tested: without it nginx exits at startup). This config never uses the
# image's default /var/cache/nginx; mounting an emptyDir there as well is harmless and future-proof.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Invite links carry a single-use secret in the path (/invite/<token>); never write it to the logs.
  map $request_uri $loggable_uri {
    ~^/invite/ "/invite/[redacted]";
    default $request_uri;
  }
  log_format dashboard '$remote_addr [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout dashboard;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite puts a content hash in every file name under /assets/, so a changed file gets a new URL:
  # those can be cached for a year. index.html must always be revalidated so a deploy is picked up.
  # (Set from one map at server level, because an add_header inside a location would silently drop
  # every add_header inherited from the server block, including the security headers.)
  map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA only ever loads its own files and calls its own origin (/api is same-origin via Traefik).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # no-referrer: an invite URL must never leak to another site through the Referer header.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Only on successful responses (no "always"), so a 404 is never cached for a year.
    add_header Cache-Control $cache_control;

    # Liveness/readiness probe: nginx is up and serving.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # /api and /mcp belong to the gateway (Traefik routes them there). If one ever reaches nginx, answer
    # with an API-shaped 404 instead of index.html, which would look like a successful JSON call.
    location ^~ /api/ {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"This path is served by the gateway, not the dashboard"}}';
    }
    location = /mcp {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"This path is served by the gateway, not the dashboard"}}';
    }

    # A missing hashed asset is a real 404 (never the SPA page, which the browser would try to run as JS).
    location /assets/ {
      try_files $uri =404;
    }

    # Everything else is a client-side route (/servers, /invite/abc, ...): serve the app shell.
    location / {
      try_files $uri /index.html;
    }
  }
}
