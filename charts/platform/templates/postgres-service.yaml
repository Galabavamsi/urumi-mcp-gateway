# Reached only by gateway pods (enforced by NetworkPolicy). PGHOST=postgres in the gateway.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "platform.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
