{{- if .Values.gateway.enabled }}
# The gateway's public port: /api and /mcp, routed by the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Prometheus /metrics on its own port and its own Service, so it can never be reached through the
# Ingress (which only knows Service "gateway", port 8080). The NetworkPolicy keeps it closed unless
# networkPolicy.metricsFrom names a scraper.
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
  labels:
    {{- include "platform.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
{{- end }}
