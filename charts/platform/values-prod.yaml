# Production: k3s on the EC2 VPS (docs/VPS.md). scripts/vps/deploy.sh runs, in effect:
#   helm upgrade --install platform charts/platform -n platform -f charts/platform/values-prod.yaml \
#     --set-string gateway.image.tag=<sha> --set-string dashboard.image.tag=<sha> \
#     --wait --timeout 15m --rollback-on-failure
# Images come from GHCR tagged with the git commit CI built them from, so the tags are set at deploy
# time (the templates refuse to render without them).
#
# Resource budget (requests; the whole node is in docs/VPS.md): gateway 192Mi, dashboard 32Mi,
# Postgres 256Mi: under 0.5 GiB of a t3.large's ~7.5 GiB allocatable, 210m of its 2 vCPUs.

# Pull credentials, only while the GHCR packages are private: deploy.sh creates Secret ghcr-pull from
# GHCR_PULL_TOKEN and then passes --set imagePullSecrets[0].name=ghcr-pull. Public packages need nothing.
imagePullSecrets: []

ingress:
  host: app.urumi.humanslop.in
  annotations:
    # cert-manager sees this annotation plus the tls block below and keeps a Let's Encrypt certificate
    # in tls.secretName (HTTP-01 through Traefik, see cluster/cert-manager/cluster-issuers.yaml).
    # To try the flow with untrusted staging certificates first:
    #   CLUSTER_ISSUER=letsencrypt-staging bash scripts/vps/deploy.sh   (re-run without it to switch back)
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: platform-tls

gateway:
  image:
    repository: ghcr.io/galabavamsi/gateway
    tag: ""                        # set with --set-string gateway.image.tag=<git-sha>
  # What the UI shows (MCP URL = <publicBaseUrl>/mcp, invite links). Must be https://<ingress.host>; the
  # chart refuses an https URL without cookieSecure: true (and the reverse).
  publicBaseUrl: https://app.urumi.humanslop.in
  cookieSecure: true               # the session cookie is only ever sent over HTTPS
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    # More burst room than the default 512Mi: chat streams plus upstream responses buffered up to 4 MB
    # each, with several users at once.
    limits: { cpu: "1", memory: 768Mi }

dashboard:
  image:
    repository: ghcr.io/galabavamsi/dashboard
    tag: ""                        # set with --set-string dashboard.image.tag=<git-sha>

postgres:
  persistence:
    size: 5Gi
    storageClass: local-path       # k3s local-path on the EBS root volume (encrypted, DeleteOnTermination=false)

# Nightly Postgres dumps (postgres-backup, 02:15 IST) onto their own kept PVC. The block and its defaults
# (keep 7, 2Gi, requests/limits) are in values.yaml; commands and restore in scripts/backup/README.md.
# On in production, off locally.
backup:
  enabled: true
  persistence:
    storageClass: local-path     # the database's disk too: copy dumps off the VPS (scripts/backup/fetch.sh)

# Prometheus is not installed. When it is, open the metrics port to it only:
# networkPolicy:
#   metricsFrom:
#     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
#       podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
