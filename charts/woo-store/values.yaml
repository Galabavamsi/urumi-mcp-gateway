# Defaults for one WooCommerce store. Environment files override only what differs:
#   values-local.yaml  k3d on the laptop (http, local images, small resources)
#   values-prod.yaml   k3s on the VPS (https via cert-manager, GHCR images, bigger volumes)
# Names, ports, labels and Secrets follow docs/CONTRACTS.md.

# --- Store settings (applied by the bootstrap initContainer on every pod start) --------------------
store:
  name: "Kaveri & Co."                  # also the chat agent's name for the shop (platform chart: gateway.storeName)
  tagline: "Everyday goods, made in India"
  # The catalog (products, photos, Home and About pages, menu) is not a value: it is baked into the
  # image (images/wordpress/seed) and imported once per store, after which it is the merchant's.
  country: "IN:KA"                       # country:state, as WooCommerce stores it
  address: "100 Feet Road, Indiranagar"
  city: Bengaluru
  postcode: "560038"
  currency: INR
  timezone: Asia/Kolkata                 # also passed to woo-mcp as STORE_TZ ("today" = store-local day)
  adminUser: admin
  adminEmail: admin@example.com          # never mailed (no mail relay); only shown in wp-admin

# --- Secrets: created by scripts/secrets.sh, only referenced here (never generated by the chart) --
secrets:
  db: woo-store-db              # root-password, password
  wordpress: woo-store-wp       # admin-password + the 8 WordPress salts
  api: woo-store-api            # consumer-key, consumer-secret (WooCommerce REST key of mcp-bot)
  mcpAuth: woo-mcp-auth         # token: bearer the gateway must present to woo-mcp

# Pull credentials for private registries (e.g. private GHCR packages in production). The Secret is
# created out of band like every other Secret (docs/CONTRACTS.md); the chart only references it.
imagePullSecrets: []

# --- Public entry point ------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  host: store.127-0-0-1.sslip.io  # WP_HOME is built from this: <scheme>://<host>
  annotations: {}
  tls:
    enabled: false                # true => https:// home URL and a tls block on the Ingress
    secretName: woo-store-tls

# --- WordPress + WooCommerce -------------------------------------------------------------------
wordpress:
  image:
    repository: urumi/wordpress
    tag: dev                      # always pin; "latest" is rejected by the templates
    pullPolicy: IfNotPresent
  # Becomes WP_ENVIRONMENT_TYPE: local | development | staging | production.
  environmentType: production
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    # Apache is capped at 10 PHP workers in the image (mpm_prefork.conf) to stay under this.
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    size: 5Gi                     # wp-content/uploads only; code lives in the image
    storageClass: ""              # "" = the cluster's default StorageClass
  bootstrap:
    dbWaitTimeoutSeconds: 180
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 768Mi }   # WP-CLI runs with memory_limit=512M
  cron:
    enabled: true
    schedule: "*/5 * * * *"
    activeDeadlineSeconds: 240    # kill a stuck run before the next one is due
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 768Mi }

# --- MariaDB -----------------------------------------------------------------------------------
mariadb:
  image:
    repository: mariadb
    tag: "11.8.9"
    pullPolicy: IfNotPresent
  database: wordpress
  user: wordpress
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    size: 10Gi
    storageClass: ""

# --- woo-mcp: our MCP server for this store (code in apps/woo-mcp) ------------------------------
wooMcp:
  enabled: true
  image:
    repository: urumi/woo-mcp
    tag: dev
    pullPolicy: IfNotPresent
  timeoutMs: 8000                 # per request to WooCommerce
  logLevel: info                  # LOG_LEVEL read by packages/mcp-common (debug | info | warn | error)
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # The only pods allowed to call woo-mcp: gateway pods in the platform namespace (both must match).
  allowFrom:
    namespace: platform
    podLabels:
      app.kubernetes.io/component: gateway

# --- NetworkPolicies ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik

# --- Backups: a nightly mariadb-dump into a volume of its own (templates/backup-*.yaml) ----------
# Off by default; production turns it on. The dump runs on the mariadb image above (client = server
# version) and logs in as the app user from secrets.db (reading is all a dump needs).
# Operations live in scripts/backup/: backup-now.sh (dump now), verify.sh (test-restore a dump into a
# throwaway server), fetch.sh (copy one to your laptop), restore-store.sh (put one back).
backup:
  enabled: false
  schedule: "0 2 * * *"           # every night at 02:00...
  timeZone: Asia/Kolkata          # ...store-local time (CronJob timeZone: an IANA zone name)
  keep: 7                         # newest dumps kept on the volume (0 = never delete any)
  activeDeadlineSeconds: 900      # a run still busy after 15 minutes is killed; its partial file never counts
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  persistence:
    size: 2Gi                     # gzip'd dumps; a demo store's dump is well under 1 MB
    storageClass: ""              # "" = the cluster's default StorageClass
