# Production k3s on the VPS. Images are built by CI and pushed to GHCR, tagged with the git SHA.
# The tag is set at deploy time, never here:
#   helm upgrade --install supplier-mcp charts/mcp-server -n mcp-upstreams \
#     -f charts/mcp-server/values-prod.yaml -f charts/mcp-server/instances/supplier.yaml \
#     --set image.tag=<git-sha> --wait --timeout 10m --rollback-on-failure
image:
  registry: ghcr.io/galabavamsi
  tag: ""                 # required at deploy (--set image.tag=<git-sha>); the chart fails without it
  pullPolicy: IfNotPresent  # SHA tags are immutable, so a cached image is always the right one

# Uncomment if the GHCR packages are private (Secret created out of band, like every other secret).
# imagePullSecrets:
#   - name: ghcr-pull

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
