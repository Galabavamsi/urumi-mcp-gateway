apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-server.name" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  # In-cluster only: the gateway reaches it at http://<name>.<namespace>.svc.cluster.local:<port>/mcp.
  type: ClusterIP
  selector:
    {{- include "mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
