<VirtualHost *:8080>
    DocumentRoot /srv/wordpress

    # The stock config grants access, FollowSymLinks and .htaccess overrides only under /var/www/, so the
    # docroot needs its own block. FollowSymLinks is required by mod_rewrite in WordPress's .htaccess
    # (pretty permalinks), and leaving out Indexes means no directory listings.
    <Directory /srv/wordpress/>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # wp-content/uploads is the only persistent, writable path (a PVC), so it must never run code: an
    # arbitrary-upload bug (plugin, import, upload filter gap) would otherwise become code execution that
    # survives restarts and image upgrades, in a pod that holds the DB password and the salts.
    <Directory /srv/wordpress/wp-content/uploads/>
        # Belt: switch mod_php off here, whatever handler a file would otherwise get.
        php_admin_flag engine off
        # Braces: with the engine off Apache would serve PHP files as plain text (source disclosure), so
        # deny them. <FilesMatch> is merged after .htaccess files, so an uploaded .htaccess cannot undo this.
        <FilesMatch "(?i)\.(php\d?|phtml|phar)$">
            Require all denied
        </FilesMatch>
        # WooCommerce writes "deny from all" (Limit, served by mod_access_compat) or "Options -Indexes" into
        # woocommerce_uploads/ and wc-logs/; Require needs AuthConfig. Allow only those, so an uploaded
        # .htaccess with SetHandler/AddHandler/php_value (FileInfo/Options) gets a 500 instead of running PHP.
        AllowOverride AuthConfig Limit Options=Indexes
    </Directory>

    # Kubelet probes hit /wp-login.php every few seconds; keep them out of the access log.
    SetEnvIf User-Agent "^kube-probe/" dontlog

    # Both log files are symlinks to the container's stdout/stderr in the base image.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog
</VirtualHost>
