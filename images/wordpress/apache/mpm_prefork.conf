# mod_php needs the prefork MPM: one process per in-flight request. The Debian default of 150
# workers x ~60-100 MB of PHP each would blow far past the pod's memory limit, so cap it at 10.
# Requests beyond that wait briefly in the listen backlog instead of getting the pod OOM-killed; that
# wait is short only because keep-alive is off (zz-urumi.conf), so a worker is free again as soon as
# its response is sent.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       10
    # Recycle a worker after 1000 requests so slow PHP memory growth cannot accumulate forever.
    MaxConnectionsPerChild 1000
</IfModule>
