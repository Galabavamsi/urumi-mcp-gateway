# Loaded after the stock conf-enabled/*.conf files (alphabetical order), so these settings win.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# No keep-alive. Under mod_php prefork a kept-alive connection pins a whole PHP process while it idles
# (Debian default: up to 5 s after every response). With only 10 workers, the idle connections held by
# Traefik and woo-mcp take every worker and queued requests stall for the full KeepAliveTimeout
# (measured: 5.2 s at 12 concurrent page views). Our only clients are Traefik and woo-mcp on the pod
# network, where a new TCP connection costs a fraction of a millisecond. Turning it off also removes the
# race where Apache closes an idle connection just as Traefik reuses it, which can fail a POST with a 502.
KeepAlive Off
