; Overrides on top of php.ini-production (copied to php.ini in the Dockerfile).

; WooCommerce asks for at least 256M. WP-CLI gets 512M through the /usr/local/bin/wp wrapper.
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60
expose_php = Off
date.timezone = UTC

; No mail relay is configured and egress is denied by NetworkPolicy. The image has no sendmail
; binary, so make mail() fail cleanly (wp_mail() returns false) instead of logging
; "sendmail: not found" for every order email. Point this at an SMTP relay to send real mail.
sendmail_path = /bin/false

; Code in this image never changes at runtime (root-owned files, DISALLOW_FILE_MODS), so OPcache
; never needs to stat files looking for edits. A new image means a new container and a fresh cache.
opcache.validate_timestamps = 0
