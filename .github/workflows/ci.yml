# CI/CD for the whole monorepo. Three jobs:
#   test    typecheck, unit + integration tests (the gateway's against a real Postgres), build bundles
#   charts  helm lint + render + Kubernetes schema validation of every chart, local and prod values
#   images  build the five container images and push them to GHCR, tagged with the commit
#           (only for a push to main, and only after test and charts passed)
# Image names and tags follow docs/CONTRACTS.md ("Container images"): a deploy passes the same 7-character
# short SHA to Helm with --set-string (see charts/*/values-prod.yaml).
#
# Every action is pinned to a full commit SHA, with the release it is in a trailing comment: a tag like
# v7 can be moved to other code by whoever controls the action's repository, a commit cannot.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: by default the job token can only read the repository. The images job adds
# packages: write for itself.
permissions:
  contents: read

# One run per branch or PR at a time. A new push to a PR cancels the run in progress, whose result no
# longer matters. On main a run is never cancelled halfway through pushing images: a newer push waits
# for it (if several queue up, only the newest waiting run is kept).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Naming the shell makes GitHub run it as `bash -eo pipefail`: a failing command anywhere in a pipe
    # fails the step (the implicit default is `bash -e`, which only looks at the last command of a pipe).
    shell: bash

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # The gateway's integration tests (apps/gateway/src/gateway.integration.test.ts) need a real Postgres
      # and skip themselves when TEST_DATABASE_URL is unset. Same image and test-only password as
      # apps/gateway/scripts/test-db.sh. The tests connect as the superuser because every run creates its
      # own database (and drops it at the end).
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: gateway-test-only
        ports:
          - 5432:5432
        # The steps start only once this reports healthy. Over TCP on purpose: on first start the image
        # initialises the database with a temporary server that listens on the Unix socket only, and a
        # socket check would report "ready" before the real server is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:gateway-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave the job token in .git/config; no later step pushes

      # No `version:` input: the action installs what package.json "packageManager" says (pnpm@9.15.0),
      # the same version the Dockerfiles install, so it is written in one place.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0   # the Node of the images (node:24.21.0-alpine3.24 in docker/*.Dockerfile)
          cache: pnpm             # caches pnpm's package store, keyed on the hash of pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile   # fails if package.json and pnpm-lock.yaml disagree

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Pull requests build no images, so bundle every app here (esbuild for the Node services, Vite for
      # the dashboard) to catch a broken build before it is merged.
      - name: Build
        run: pnpm -r build

  charts:
    name: Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      # SHA-256 of kubeconform-linux-amd64.tar.gz from that release (its CHECKSUMS file). Written here, not
      # downloaded next to the archive, so a replaced archive fails the check instead of passing it.
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0   # the Helm used on the laptop (WSL) and for the VPS

      - name: Install kubeconform
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The same script runs locally inside WSL: bash .github/scripts/check-charts.sh
      - name: Lint, render and validate every chart (local and prod values)
        run: bash .github/scripts/check-charts.sh

  images:
    name: Image ${{ matrix.image }}
    needs: [test, charts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read    # checkout
      packages: write   # push to ghcr.io with the job token (no personal access token anywhere)
    env:
      # The registry prefix of docs/CONTRACTS.md; charts/*/values-prod.yaml name the same repositories.
      REGISTRY: ghcr.io/galabavamsi
    strategy:
      # Each image is built and pushed on its own: one failing does not cancel the other four. The run
      # still fails, which marks the commit as not deployable (one of its images is missing).
      fail-fast: false
      matrix:
        # Contexts, Dockerfiles and build args exactly as in scripts/dev-up.sh step 3.
        include:
          - image: wordpress
            context: images/wordpress   # its own folder: the root .dockerignore excludes images/
            file: images/wordpress/Dockerfile
          - image: woo-mcp
            context: .
            file: docker/node-service.Dockerfile
            build-args: APP=woo-mcp
          - image: supplier-mcp
            context: .
            file: docker/node-service.Dockerfile
            build-args: APP=supplier-mcp
          - image: gateway
            context: .
            file: docker/node-service.Dockerfile
            build-args: APP=gateway
          - image: dashboard
            context: .
            file: docker/dashboard.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A BuildKit builder in a container (the GitHub Actions cache below needs one). Buildx and the
      # BuildKit image are pinned like everything else; the runner's preinstalled ones change on their own.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The 7-character short SHA, the format of the tags scripts/dev-up.sh builds locally
      # (`git rev-parse --short HEAD`). Expressions cannot cut strings, so a step does it.
      - name: Short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Two tags, never `latest`: the short SHA is what Helm deploys, the full SHA is unambiguous forever.
      # The labels link the GHCR package to this repository and record the exact commit.
      # No --network=host as in dev-up.sh: that works around WSL's MTU, which GitHub's runners don't have.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64   # the EC2 t3.large is x86-64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache in the GitHub Actions cache, one scope per image: without scopes the five builds
          # would share one cache index and each would overwrite the others'. mode=max also caches the
          # layers of the build stages (pnpm install, esbuild, downloads), not only the final image's.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed \`${IMAGE}\` (\`${DIGEST}\`)" >> "$GITHUB_STEP_SUMMARY"
